      (auditFilterActive() ? '<button type="button" class="lc-btn ghost small" id="lc-aud-reset">Reset pencarian dan filter</button>' : '') +
      (S.auditErr ? '<p class="lc-err" role="alert" style="width:100%">' + esc(S.auditErr) + '</p>' : '');
    var rs = info.querySelector('#lc-aud-reset');
    if (rs) rs.onclick = function () {
      S.auditQ = ''; S.auditAction = 'all'; S.auditMember = 'all'; S.auditSort = 'terbaru'; S.auditLimit = 300;
      app.querySelector('#lc-aud-search').value = '';
      app.querySelector('#lc-aud-action').value = 'all';
      app.querySelector('#lc-aud-member').value = 'all';
      app.querySelector('#lc-aud-sort').value = 'terbaru';
      fetchAudit();
    };
    box.className = S.auditBusy ? 'lc-mem-dim' : '';
    box.innerHTML = d.items.length ? d.items.map(auditItemHtml).join('')
      : '<p class="lc-mute">' + (d.total ? 'Tidak ada log yang cocok dengan pencarian atau filter.' : 'Belum ada log.') + '</p>';
    more.innerHTML = (!S.auditBusy && d.shown < d.matched && S.auditLimit < 1000)
      ? '<button type="button" class="lc-btn ghost" id="lc-aud-morebtn">Tampilkan lebih banyak</button>' : '';
    var mb = more.querySelector('#lc-aud-morebtn');
    if (mb) mb.onclick = function () { S.auditLimit = Math.min(1000, S.auditLimit + 300); fetchAudit(); };
  }

  function viewAudit() {
    var d = S.auditData || { actions: [], members: [] };
    var actOpts = '<option value="all">Semua aksi</option>' + (d.actions || []).map(function (a) {
      return '<option value="' + esc(a.value) + '"' + (S.auditAction === a.value ? ' selected' : '') + '>' + esc(a.label) + '</option>';
    }).join('');
    var memOpts = '<option value="all">Semua anggota</option>' + (d.members || []).map(function (id) {
      return '<option value="' + esc(id) + '"' + (S.auditMember === id ? ' selected' : '') + '>' + esc(id) + '</option>';
    }).join('');
    var sortOpts = AUDIT_SORTS.map(function (o) {
      return '<option value="' + o[0] + '"' + (S.auditSort === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('');

    app.innerHTML = navBar() +
      '<div class="lc-rule"></div><h2>Audit log</h2>' +
      '<p class="lc-mute" style="margin-top:10px">Riwayat aktivitas semua akun, tersimpan di tab <strong>AuditLog</strong> pada spreadsheet. ' +
      'Kode akses dan isi catatan review tidak pernah dicatat.</p>' +
      '<div class="lc-search"><label class="lc-label" for="lc-aud-search">Cari log</label>' +
      '<input class="lc-input" id="lc-aud-search" type="search" placeholder="Cari ID anggota, nama, ID soal, ringkasan, atau detail…" value="' + esc(S.auditQ) + '" autocomplete="off">' +
      '<div class="lc-filterrow">' +
      '<div><label class="lc-label" for="lc-aud-action">Aksi</label><select class="lc-select" id="lc-aud-action">' + actOpts + '</select></div>' +
      '<div><label class="lc-label" for="lc-aud-member">Anggota</label><select class="lc-select" id="lc-aud-member">' + memOpts + '</select></div>' +
      '<div><label class="lc-label" for="lc-aud-sort">Urutkan</label><select class="lc-select" id="lc-aud-sort">' + sortOpts + '</select></div>' +
      '</div>' +
      '<div class="lc-row" style="margin-top:8px" id="lc-aud-info"></div></div>' +
      '<div id="lc-aud-list"></div>' +
      '<div class="lc-row" id="lc-aud-more" style="margin:6px 0 10px"></div>' +
      '<div class="lc-row" style="margin-top:10px"><button class="lc-btn ghost" id="lc-aud-reload">Muat ulang</button>' +
      '<button class="lc-btn ghost" id="lc-menu-back">Kembali ke menu</button></div>';
    bindNav();

    app.querySelector('#lc-aud-search').oninput = function (e) {
      S.auditQ = e.target.value; S.auditLimit = 300;
      clearTimeout(S.auditTimer);
      S.auditTimer = setTimeout(fetchAudit, 350); // tunggu berhenti mengetik
    };
    app.querySelector('#lc-aud-action').value = S.auditAction;
    app.querySelector('#lc-aud-member').value = S.auditMember;
    app.querySelector('#lc-aud-action').onchange = function (e) { S.auditAction = e.target.value; S.auditLimit = 300; fetchAudit(); };
    app.querySelector('#lc-aud-member').onchange = function (e) { S.auditMember = e.target.value; S.auditLimit = 300; fetchAudit(); };
    app.querySelector('#lc-aud-sort').onchange = function (e) { S.auditSort = e.target.value; S.auditLimit = 300; fetchAudit(); };
    app.querySelector('#lc-aud-reload').onclick = fetchAudit;
    paintAudit();
  }

  /* ====== PENGATURAN PLATFORM (khusus admin) ======
     Daftar setting, label, dan batas nilainya dikirim oleh server (SETTINGS di Code.gs),
     jadi kalau ada setting baru di backend, halaman ini ikut menampilkannya sendiri. */
  function applySettingsToConfig(list) {
    (list || []).forEach(function (s) {
      if (s.key === 'ESTIMASIMIN_DETIK') CONFIG.MIN_EST = s.value;
      else if (s.key === 'ESTIMASIMAKS_DETIK') CONFIG.MAX_EST = s.value;
      else if (s.key === 'MAKSGAMBAR') CONFIG.MAX_IMAGES = s.value;
      else if (s.key === 'TOLERANSIWAKTU_PERSEN') CONFIG.TIME_TOLERANCE = s.value / 100;
      else if (s.key === 'RUBRIKMIN') CONFIG.RUBRIC_MIN = s.value;
      else if (s.key === 'RUBRIKMAKS') CONFIG.RUBRIC_MAX = s.value;
      else if (s.key === 'BATCH') S.currentBatch = s.value;
      else if (s.key === 'ENABLE_BUATSOAL') S.memberCreateOpen = !!s.value;
      else if (s.key === 'TIPESOAL') S.allowedTypes = s.value;
      else if (s.key === 'MAKSSOALPERBATCH') S.maxQuestionsPerBatch = s.value;
      else if (s.key === 'ANGGOTA_LIHAT_ANGGOTA') S.membersOpen = S.role === 'admin' || !!s.value;
    });
  }
  function takeSettings(res) {
    S.setList = res.settings || [];
    S.setVals = {};
    S.setList.forEach(function (s) { S.setVals[s.key] = s.value; });
    applySettingsToConfig(S.setList);
  }
  function openSettings() {
    S.err = ''; S.setErr = ''; S.setMsg = '';
    rememberScreen('settings');
    viewLoading('Memuat pengaturan platform…');
    api('settings_get').then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Gagal memuat pengaturan.');
      takeSettings(res);
      S.screen = 'settings'; render();
    }).catch(function (e) {
      if (isHandled(e)) return;
      S.err = e.message; S.screen = 'menu'; loadStatus();
    });
  }

  function viewSettings() {
    var fields = S.setList.map(function (s) {
      var v = S.setVals[s.key];
      if (s.type === 'bool') {
        return '<div class="lc-set"><label class="lc-toggle">' +
          '<input type="checkbox" data-set="' + esc(s.key) + '"' + (v ? ' checked' : '') + '>' +
          '<strong>' + esc(s.label) + '</strong></label>' +
          '<p class="lc-mute">' + esc(s.help) + '</p></div>';
      }
      if (s.type === 'enum') {
        var opts = (s.options || []).map(function (o) {
          return '<option value="' + esc(o.value) + '"' + (v === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('');
        return '<div class="lc-set"><label class="lc-label" for="set-' + esc(s.key) + '">' + esc(s.label) + '</label>' +
          '<select class="lc-select" id="set-' + esc(s.key) + '" data-set="' + esc(s.key) + '">' + opts + '</select>' +
          '<p class="lc-mute">' + esc(s.help) + '</p></div>';
      }
      var suffix = s.type === 'percent' ? '%' : '';
      return '<div class="lc-set"><label class="lc-label" for="set-' + esc(s.key) + '">' + esc(s.label) + '</label>' +
        '<div class="lc-setnum"><input class="lc-input" id="set-' + esc(s.key) + '" type="number" inputmode="numeric" ' +
        'min="' + s.min + '" max="' + s.max + '" step="1" data-set="' + esc(s.key) + '" value="' + esc(v) + '">' +
        (suffix ? '<span class="lc-mute">' + suffix + '</span>' : '') + '</div>' +
        '<p class="lc-mute">' + esc(s.help) + ' Rentang ' + s.min + '–' + s.max + ', default: ' + esc(s.def) + '.</p></div>';
    }).join('');

    app.innerHTML = navBar() +
      '<div class="lc-rule"></div><h2>Pengaturan platform</h2>' +
      '<p class="lc-mute" style="margin-top:10px">Sama dengan tab <strong>Pengaturan</strong> di spreadsheet — perubahan di sini ' +
      'langsung ditulis ke sana dan berlaku untuk semua orang tanpa deploy ulang. Hanya akun admin yang bisa membuka halaman ini.</p>' +
      (S.setMsg ? '<div class="lc-notice" style="margin-top:14px"><p>' + esc(S.setMsg) + '</p></div>' : '') +
      '<div class="lc-card" style="margin-top:16px">' + fields + '</div>' +
      '<div class="lc-actions lc-row"><button class="lc-btn" id="lc-set-save">Simpan pengaturan</button>' +
      '<button class="lc-btn ghost" id="lc-set-reload">Muat ulang</button>' +
      '<button class="lc-btn ghost" id="lc-menu-back">Kembali ke menu</button></div>' +
      (S.setErr ? '<p class="lc-err" role="alert">' + esc(S.setErr) + '</p>' : '');

    bindNav();
    app.querySelectorAll('[data-set]').forEach(function (el) {
      var key = el.getAttribute('data-set');
      if (el.type === 'checkbox') el.onchange = function () { S.setVals[key] = el.checked; };
      else if (el.tagName === 'SELECT') el.onchange = function () { S.setVals[key] = el.value; };
      else el.oninput = function () { S.setVals[key] = el.value; };
    });
    app.querySelector('#lc-set-reload').onclick = openSettings;

    var save = app.querySelector('#lc-set-save');
    save.disabled = S.setBusy;
    save.onclick = function () {
      confirmBox({
        title: 'Simpan pengaturan platform?',
        text: 'Perubahan langsung berlaku untuk semua anggota, termasuk yang sedang membuka web app.',
        detail: 'Mengubah "Batch aktif" membuat soal baru dan pembagian review pindah ke batch itu (batch 0 = Batch Trial). ' +
          'Mengubah "Tipe soal" hanya membatasi tipe yang boleh dibuat ANGGOTA baru; soal yang sudah ada tidak terpengaruh. ' +
          'Mengubah rentang nilai rubrik (RUBRIKMIN/RUBRIKMAKS) hanya berlaku untuk penilaian baru; penilaian lama yang sudah tersimpan tidak diskalakan ulang. ' +
          'Menutup menu review atau pembuatan soal tidak menghapus progres yang sudah tersimpan.',
        ok: 'Ya, simpan',
        cancel: 'Periksa lagi',
        onOk: function () {
          S.setBusy = true; S.setErr = ''; S.setMsg = '';
          save.disabled = true; save.textContent = 'Menyimpan…';
          api('settings_save', { settings: S.setVals }).then(function (res) {
            S.setBusy = false;
            if (!res.ok) throw new Error(res.error || 'Gagal menyimpan pengaturan.');
            takeSettings(res);
            S.setMsg = res.message || 'Pengaturan tersimpan.';
            viewSettings();
          }).catch(function (e) {
            S.setBusy = false;
            if (isHandled(e)) return;
            S.setErr = e.message;
            viewSettings();
          });
        }
      });
    };
  }

  /* ====== "SOAL SAYA" (daftar + form buat/ubah) ====== */
  function openMine() {
    S.err = '';
    rememberScreen('mine');
    viewLoading('Memuat soal kamu…');
    api('mine').then(function (res) {
      if (!res.ok) throw new Error(res.error || 'Gagal memuat.');
      S.mineList = res.questions; S.mineMade = res.made; S.mineMax = res.max;
      S.mineMadeThisBatch = res.madeThisBatch || 0;
      S.memberCreateOpen = res.memberCreateOpen;
      S.allowedTypes = res.allowedTypes || 'KEDUANYA';
      S.mineOverall = res.overall || null;
      S.showReviewerNames = !!res.showReviewerNames;
      S.namesBySetting = !!res.namesBySetting;
      S.orphanReviews = res.orphanReviews || 0;
      S.screen = 'mine'; render();
    }).catch(function (e) {
      if (isHandled(e)) return;
      S.err = e.message; S.screen = 'menu'; loadStatus();
    });
  }
  // Satu kotak statistik (angka besar + keterangan kecil)
  function statBox(val, label) {
    return '<div class="lc-stat"><b>' + esc(val) + '</b><span>' + esc(label) + '</span></div>';
  }
  // Satu review yang masuk ke soal saya
  function reviewItem(r) {
    return '<div class="lc-rv"><div class="lc-rv-h">' +
      '<div><strong>' + esc(r.reviewer) + '</strong>' + (r.isAdmin ? ' <span class="lc-badge">Admin</span>' : '') +
      '<p class="lc-rv-sub">' + esc(r.ts) + '</p></div>' +
      '<span class="lc-rv-score">' + r.total + '</span></div>' +
      '<p class="lc-rv-sub">Jawaban reviewer: ' + esc(r.jawaban || '–') + ' • Waktu pengerjaan ' + fmt(r.actual) + ' (estimasimu ' + fmt(r.est) + ') • ' +
      'Jawaban ' + (r.correct ? 'benar' : 'salah') + '</p>' +
      '<p class="lc-rv-sub">Correctness ' + r.c + ' • Clarity ' + r.cl + ' • Complexity ' + r.cx +
      ' • Information ' + r.inf + ' • Time ' + r.time + '</p>' +
      (r.note ? '<p class="lc-rv-note">“' + esc(r.note) + '”</p>' : '') +
      '</div>';
  }
  // Blok review untuk satu soal: ringkasan + daftar yang bisa dibuka/tutup
  function reviewBlock(q) {
    var st = q.stats || { count: 0 };
    if (!st.count) return '<p class="lc-rv-empty">Belum ada yang mereview soal ini.</p>';
    var open = !!S.mineOpen[q.qid];
    return '<div class="lc-stats" style="margin-top:10px">' +
      statBox(st.count, 'review masuk') +
      statBox(st.avgTotal, 'rata-rata skor') +
      statBox(fmt(st.avgActual), 'rata-rata waktu') +
      '</div>' +
      '<button class="lc-btn ghost small" style="margin-top:10px" data-toggle="' + esc(q.qid) + '">' +
      (open ? 'Sembunyikan ' + st.count + ' review' : 'Lihat ' + st.count + ' review') + '</button>' +
      (open ? q.reviews.map(reviewItem).join('') : '');
  }

  // Hapus soal milik sendiri (aturan boleh/tidaknya mengikuti EDITSOAL, dicek ulang oleh server).
  function deleteMine(qid) {
    var q = S.mineList.filter(function (x) { return x.qid === qid; })[0];
    var nRv = q && q.stats ? q.stats.count : 0;
    confirmBox({
      title: 'Hapus soal ' + qid + '?',
      text: 'Soal dan gambarnya akan dihapus dan tidak bisa dipulihkan dari sini.',
      detail: (nRv ? nRv + ' review yang sudah masuk untuk soal ini tidak akan tampil lagi. ' : '') +
        'Jumlah soalmu di batch tempat soal ini dibuat akan berkurang satu.',
      ok: 'Ya, hapus soal',
      cancel: 'Batal',
      danger: true,
      onOk: function () {
        viewLoading('Menghapus soal…');
        api('delete', { qid: qid }).then(function (res) {
          if (!res.ok) throw new Error(res.error || 'Gagal menghapus soal.');
          dropProg(qid);
          S.mineNote = { kind: 'ok', text: 'Soal ' + qid + ' sudah dihapus.' };
          openMine();
        }).catch(function (e) {
          if (isHandled(e)) return;
          S.mineNote = { kind: 'err', text: 'Soal ' + qid + ' belum terhapus: ' + e.message };
          openMine();
        });
      }
    });
  }

  function viewMine() {
    var createOpen = S.role === 'admin' || S.memberCreateOpen;
    var note = S.mineNote; S.mineNote = null;
    var canAdd = createOpen && (S.role === 'admin' || !S.mineMax || S.mineMadeThisBatch < S.mineMax);
    var rows = S.mineList.map(function (q) {
      var canEdit = q.editable;
      var typeBadge = '<span class="lc-badge">' + esc(typeLabel(q.type)) + '</span>';
      var keyInfo = q.type === 'pg'
        ? 'Kunci: ' + esc(q.answer)
        : 'Jawaban diterima: ' + esc((q.answers || []).join(', ')) + (q.caseSensitive ? ' (case sensitive)' : ' (tidak case sensitive)');
      return '<div class="lc-list-item lc-mine-item"><div class="lc-head"><div class="lc-meta">' +
        '<p><strong>' + esc(q.qid) + '</strong> ' + typeBadge + ' • ' + esc(batchName(q.batch)) + '</p>' +
        '<p class="lc-mute">' + esc(q.soal.slice(0, 90)) + (q.soal.length > 90 ? '…' : '') + '</p>' +
        '<p class="lc-mute">' + keyInfo + ' • Estimasi: ' + q.est + ' dtk • ' +
        (q.editable ? '<span class="lc-badge">Bisa diedit</span>' : '<span class="lc-badge">Terkunci</span>') + '</p>' +
        '</div><div class="lc-list-actions">' +
        '<button class="lc-btn small" data-qid="' + esc(q.qid) + '"' + (canEdit ? '' : ' disabled') + '>Edit</button>' +
        '<button class="lc-btn ghost small danger" data-delqid="' + esc(q.qid) + '"' + (q.deletable ? '' : ' disabled') + '>Hapus</button>' +
        '</div></div>' +
        reviewBlock(q) + '</div>';
    }).join('') || '<p class="lc-mute">Kamu belum membuat soal.</p>';

    // Ringkasan semua review yang masuk ke seluruh soal saya
    var ov = S.mineOverall || { count: 0 };
    var nameNote = S.role === 'admin'
      ? 'Sebagai admin, kamu selalu melihat nama pereview yang sebenarnya.'
      : (S.namesBySetting
        ? 'Admin mengizinkan anggota melihat nama pereview.'
        : 'Nama pereview disembunyikan; hanya admin yang bisa melihatnya.');
    // Baris Review yang soalnya sudah tidak ada di tab Soal/SoalIsian (mis. barisnya dihapus)
    var orphanNote = S.orphanReviews
      ? '<div class="lc-notice" style="margin-top:14px"><p>' + S.orphanReviews +
        ' review lain tercatat atas namamu, tapi soalnya sudah tidak ada di tab Soal_PG/Soal_IS ' +
        '(barisnya terhapus atau dikosongkan), jadi tidak ikut dihitung di sini. Hubungi admin kalau ini tidak seharusnya terjadi.</p></div>'
      : '';
    var overallCard = '';
    if (ov.count) {
      overallCard = '<div class="lc-card"><h3>Review yang masuk ke soalmu</h3>' +
        '<div class="lc-stats">' +
        statBox(ov.count, 'total review') +
        statBox(ov.avgTotal, 'rata-rata skor') +
        statBox(fmt(ov.avgActual), 'rata-rata waktu') +
        statBox(ov.correctCount + '/' + ov.count, 'jawaban benar') +
        '</div>' +
        '<p class="lc-mute" style="margin:14px 0 0">Rata-rata dari semua penilaian pada semua soalmu. ' +
        nameNote + '</p>' + orphanNote + '</div>';
    } else {
      overallCard = '<div class="lc-card"><h3>Review yang masuk ke soalmu</h3>' +
        '<p class="lc-mute" style="margin:0">Belum ada review yang masuk. Hasil penilaian akan muncul di sini, ' +
        'termasuk skor, waktu pengerjaan, dan catatan dari pereview.</p>' + orphanNote + '</div>';
    }

    var maxTxt = (S.role === 'admin' || !S.mineMax) ? 'tanpa batas per batch' : (S.mineMadeThisBatch + ' dari ' + S.mineMax + ' untuk batch ini');
    var typeNote = S.role === 'admin' ? '' :
      '<p class="lc-mute" style="margin-top:2px">Tipe soal yang bisa kamu buat: ' + esc(TYPE_LABELS[S.allowedTypes] || S.allowedTypes) + '.</p>';
    app.innerHTML = navBar() +
      '<div class="lc-rule"></div><h2>Soal saya</h2>' +
      '<p class="lc-mute">' + maxTxt + '</p>' + typeNote +
      (createOpen ? '' : '<div class="lc-notice"><p>Pembuatan soal baru sedang ditutup oleh admin.</p></div>') +
      '<div class="lc-row" style="margin:14px 0"><button class="lc-btn" id="lc-add"' + (canAdd ? '' : ' disabled') + '>+ Buat soal baru</button>' +
      '<button class="lc-btn ghost" id="lc-menu-back">Kembali ke menu</button></div>' +
      (note ? (note.kind === 'err'
        ? '<p class="lc-err" role="alert">' + esc(note.text) + '</p>'
        : '<div class="lc-notice" role="status"><p>' + esc(note.text) + '</p></div>') : '') +
      overallCard +
      rows +
      (S.err ? '<p class="lc-err" role="alert">' + esc(S.err) + '</p>' : '');
    bindNav();
    app.querySelector('#lc-add').onclick = function () { openCreateForm(null); };
    app.querySelectorAll('[data-qid]').forEach(function (b) {
      b.onclick = function () { openCreateForm(b.getAttribute('data-qid')); };
    });
    app.querySelectorAll('[data-delqid]').forEach(function (b) {
      b.onclick = function () { deleteMine(b.getAttribute('data-delqid')); };
    });
    app.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.onclick = function () {
        var qid = b.getAttribute('data-toggle');
        S.mineOpen[qid] = !S.mineOpen[qid];
        viewMine();
      };
    });
  }

  // Tipe bawaan saat membuat soal baru, mengikuti pengaturan TIPESOAL.
  function defaultCreateType() {
    if (S.allowedTypes === 'PG') return 'pg';
    if (S.allowedTypes === 'ISIAN') return 'isian';
    return 'pg';
  }

  // Isi state form dari data satu soal. q berbentuk sama untuk "Soal saya" (mine)
  // maupun admin_question_full: { qid, type, soal, est, images, options/answer | answers/caseSensitive }.
  function fillForm(q) {
    S.editingQid = q.qid; S.formType = q.type; S.formSoal = q.soal;
    S.formOpts = { A: '', B: '', C: '', D: '', E: '' };
    S.formAnswer = ''; S.formAnswers = ''; S.formCaseSensitive = false;
    if (q.type === 'pg') {
      (q.options || []).forEach(function (o) { S.formOpts[o.key] = o.text; });
      S.formAnswer = q.answer || '';
    } else {
      S.formAnswers = (q.answers || []).join('\n');
      S.formCaseSensitive = !!q.caseSensitive;
    }
    S.formEst = String(q.est);
    S.formImagesKeep = (q.images || []).slice();
  }

  function openCreateForm(qid) {
    S.formErr = ''; S.formImagesNew = [];
    S.formOrigin = 'mine'; S.formCreator = ''; S.formBatch = 0;
    if (qid) {
      var q = S.mineList.find(function (x) { return x.qid === qid; });
      if (!q) return;
      fillForm(q);
    } else {
      S.editingQid = null;
      S.formType = defaultCreateType();
      S.formSoal = '';
      S.formOpts = { A: '', B: '', C: '', D: '', E: '' };
      S.formAnswer = ''; S.formAnswers = ''; S.formCaseSensitive = false;
      S.formEst = ''; S.formImagesKeep = [];
    }
    S.screen = 'create'; render();
  }

    var isEdit = !!S.editingQid;
    var fromAdminList = S.formOrigin === 'adminlist';
    var canPickType = !isEdit && (S.allowedTypes === 'KEDUANYA' || S.role === 'admin');
    var typeSelector = '';
    if (canPickType) {
      typeSelector = '<div class="lc-fieldset"><label class="lc-label">Tipe soal</label>' +
        '<div role="radiogroup" aria-label="Tipe soal">' +

        '<label class="lc-opt"><input type="radio" name="lc-type" value="isian"' + (S.formType === 'isian' ? ' checked' : '') + '><span>Isian singkat</span></label>' +
        '</div></div>';
    } else if (isEdit) {
      typeSelector = '<p class="lc-mute" style="margin-top:14px">Tipe soal: <strong>' + esc(typeLabel(S.formType)) + '</strong> (tidak bisa diubah).</p>';
    } else {
      typeSelector = '<p class="lc-mute" style="margin-top:14px">Tipe soal: <strong>' + esc(typeLabel(S.formType)) + '</strong> (admin membatasi tipe yang boleh dibuat saat ini).</p>';
    }

      }).join('') + '</div>';
      typeFields = '<div class="lc-fieldset">' + optsHtml + '</div>' +
        '<div class="lc-fieldset"><label class="lc-label">Jawaban benar</label>' + answerHtml + '</div>';
    } else {
      typeFields = '<div class="lc-fieldset">' +
        '<label class="lc-label" for="lc-answers">Jawaban yang diterima (satu per baris)</label>' +
        '<textarea class="lc-textarea" id="lc-answers" maxlength="2000" placeholder="Tulis semua variasi jawaban yang benar, satu per baris.">' + esc(S.formAnswers) + '</textarea>' +
        '<p class="lc-mute lc-hintline">Reviewer dianggap benar kalau jawabannya cocok dengan salah satu baris ini (maks. 20 variasi).</p></div>' +
        '<div class="lc-fieldset"><label class="lc-toggle"><input type="checkbox" id="lc-cs"' + (S.formCaseSensitive ? ' checked' : '') + '> Perhatikan huruf besar/kecil (case sensitive)</label>' +
        '<p class="lc-mute lc-hintline">Kalau tidak dicentang, "Pascal" dan "pascal" dianggap sama.</p></div>';

    var keepThumbs = S.formImagesKeep.map(function (fid) {
      return '<div class="lc-thumb" data-keep="' + esc(fid) + '"><img id="thumb-' + esc(fid) + '" alt="Gambar soal"><button type="button" data-remove-keep="' + esc(fid) + '">×</button></div>';
    }).join('');
    var newThumbs = S.formImagesNew.map(function (im, i) {
      return '<div class="lc-thumb"><img src="' + im.preview + '" alt="Gambar baru"><button type="button" data-remove-new="' + i + '">×</button></div>';
    }).join('');
    var totalImgs = S.formImagesKeep.length + S.formImagesNew.length;

    app.innerHTML = navBar() +
      '<div class="lc-rule"></div><h2>' + (isEdit ? 'Ubah soal ' + esc(S.editingQid) : 'Buat soal baru') + '</h2>' +
      originNote +
      typeSelector +
      '<div class="lc-fieldset" style="margin-top:18px"><label class="lc-label">Gambar (opsional, maks. ' + CONFIG.MAX_IMAGES + ')</label>' +
      '<div class="lc-thumbs" id="lc-thumbs">' + keepThumbs + newThumbs + '</div>' +
      '<label class="lc-btn ghost small lc-filebtn">+ Tambah gambar<input type="file" id="lc-imgpick" accept="image/*" multiple' + (totalImgs >= CONFIG.MAX_IMAGES ? ' disabled' : '') + '></label>' +
      '<p class="lc-mute lc-hintline" id="lc-imghint"></p></div>' +
      '<div class="lc-fieldset">' +
      '<label class="lc-label" for="lc-soal">Soal</label>' +
      '<textarea class="lc-textarea" id="lc-soal" maxlength="3000" placeholder="Tulis soal di sini. Bungkus kode Pascal dengan ``` di awal dan akhir agar tampil sebagai blok kode.">' + esc(S.formSoal) + '</textarea>' +
      '<p class="lc-mute lc-hintline">5–3000 karakter.</p></div>' +
      typeFields +
      '<div class="lc-fieldset"><label class="lc-label" for="lc-est">Estimasi waktu pengerjaan (detik)</label>' +
      '<input class="lc-input" id="lc-est" type="number" min="' + CONFIG.MIN_EST + '" max="' + CONFIG.MAX_EST + '" value="' + esc(S.formEst) + '">' +
      '<p class="lc-mute lc-hintline">' + CONFIG.MIN_EST + '–' + CONFIG.MAX_EST + ' detik.</p></div>' +
      '<div class="lc-actions lc-row"><button class="lc-btn" id="lc-save">' + (isEdit ? 'Perbarui soal' : 'Simpan soal') + '</button>' +
      '<button class="lc-btn ghost" id="lc-cancel">Batal</button></div>' +
      (S.formErr ? '<p class="lc-err" role="alert">' + esc(S.formErr) + '</p>' : '');

    bindNav();
    S.formImagesKeep.forEach(function (fid) {
      fetchImg(fid).then(function () {
        var im = app.querySelector('#thumb-' + fid);
        if (im) im.src = (S.img[fid] && S.img[fid] !== 'err') ? S.img[fid] : '';
      });
    });

    app.querySelector('#lc-soal').oninput = function (e) { S.formSoal = e.target.value; };
    if (S.formType === 'pg') {
      KEYS.forEach(function (k) { app.querySelector('#lc-opt-' + k).oninput = function (e) { S.formOpts[k] = e.target.value; }; });
      app.querySelectorAll('input[name="lc-answer"]').forEach(function (r) { r.onchange = function () { S.formAnswer = r.value; }; });
    } else {
      app.querySelector('#lc-answers').oninput = function (e) { S.formAnswers = e.target.value; };
      app.querySelector('#lc-cs').onchange = function (e) { S.formCaseSensitive = e.target.checked; };
    }
    if (canPickType) {
      app.querySelectorAll('input[name="lc-type"]').forEach(function (r) {
        r.onchange = function () { S.formType = r.value; viewCreate(); };
      });
    }
    app.querySelector('#lc-est').oninput = function (e) { S.formEst = e.target.value; };
    // Batal / selesai kembali ke tempat asal: daftar soal admin atau "Soal saya".
    app.querySelector('#lc-cancel').onclick = function () {
      if (fromAdminList) openAdminList();
      else { S.screen = 'mine'; render(); }
    };

    app.querySelectorAll('[data-remove-keep]').forEach(function (b) {
      b.onclick = function () {
        var fid = b.getAttribute('data-remove-keep');
        S.formImagesKeep = S.formImagesKeep.filter(function (x) { return x !== fid; });
        viewCreate();
      };
    });
    app.querySelectorAll('[data-remove-new]').forEach(function (b) {
      b.onclick = function () {
        S.formImagesNew.splice(Number(b.getAttribute('data-remove-new')), 1);
        viewCreate();
      };
    });

    var pick = app.querySelector('#lc-imgpick');
    if (pick) pick.onchange = function () {
      var hint = app.querySelector('#lc-imghint');
      var files = Array.prototype.slice.call(pick.files || []);
      var room = CONFIG.MAX_IMAGES - (S.formImagesKeep.length + S.formImagesNew.length);
      if (files.length > room) { files = files.slice(0, room); hint.textContent = 'Hanya ' + room + ' gambar yang bisa ditambahkan (maks. ' + CONFIG.MAX_IMAGES + ').'; }
      if (!files.length) return;
      hint.textContent = 'Memproses gambar…';
      Promise.all(files.map(function (f) { return compressImage(f); })).then(function (imgs) {
        S.formImagesNew = S.formImagesNew.concat(imgs);
        viewCreate();
      }).catch(function (e) { hint.textContent = 'Gagal memproses gambar: ' + e.message; });
    };

    // Kirim ke server (dipanggil setelah pembuat soal menekan konfirmasi)
    function doSave(soal, est) {
      S.formErr = ''; S.formBusy = true;
      var editQid = S.editingQid;
      var save = app.querySelector('#lc-save'); save.disabled = true; save.textContent = 'Menyimpan…';
      var payload = {
        soal: soal, est: est,
        images: S.formImagesNew.map(function (im) { return { mime: im.mime, data: im.data }; })
      };
      if (S.formType === 'pg') {
        payload.type = 'pg'; payload.options = S.formOpts; payload.answer = S.formAnswer;
      } else {
        payload.type = 'isian';
        payload.answers = S.formAnswers.split(/\r?\n/);
        payload.caseSensitive = S.formCaseSensitive;
      }
      if (isEdit) { payload.qid = editQid; payload.keepImages = S.formImagesKeep; }
      api(isEdit ? 'update' : 'create', payload).then(function (res) {
        S.formBusy = false;
        if (!res.ok) throw new Error(res.error || 'Gagal menyimpan soal.');
        if (fromAdminList) {
          // Isi soal berubah, jadi hasil pengecekan / progres lama untuk soal ini tidak berlaku lagi.
          dropProg(editQid);
          S.adminNote = { kind: 'ok', text: 'Soal ' + editQid + ' sudah diperbarui.' };
          openAdminList();
        } else {
          openMine();
        }
      }).catch(function (e) {
        S.formBusy = false;
        if (isHandled(e)) return;
        S.formErr = e.message;
        viewCreate();
      });
    }

    app.querySelector('#lc-save').onclick = function () {
      var soal = S.formSoal.trim();
      if (soal.length < 5 || soal.length > 3000) { S.formErr = 'Isi soal 5 sampai 3000 karakter.'; return viewCreate(); }
      var est = Math.round(Number(S.formEst));
      if (!(est >= CONFIG.MIN_EST && est <= CONFIG.MAX_EST)) { S.formErr = 'Estimasi waktu harus ' + CONFIG.MIN_EST + '–' + CONFIG.MAX_EST + ' detik.'; return viewCreate(); }

      var ansList = [];
      if (S.formType === 'pg') {
        var filled = KEYS.filter(function (k) { return S.formOpts[k].trim(); });
        if (filled.length < KEYS.length) { S.formErr = 'Isi semua pilihan jawaban (A sampai E).'; return viewCreate(); }
        if (!S.formAnswer || !S.formOpts[S.formAnswer].trim()) { S.formErr = 'Pilih kunci jawaban dari pilihan yang terisi.'; return viewCreate(); }
      } else {
        ansList = S.formAnswers.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
        if (!ansList.length) { S.formErr = 'Isi minimal satu jawaban yang diterima.'; return viewCreate(); }
        if (ansList.length > 20) { S.formErr = 'Maksimal 20 variasi jawaban per soal.'; return viewCreate(); }
      }

      var nImg = S.formImagesKeep.length + S.formImagesNew.length;
      confirmBox({
        title: isEdit ? 'Perbarui soal ini?' : 'Simpan soal ini?',
        text: isEdit
          ? 'Perubahan akan menimpa isi soal sebelumnya.'
          : 'Soal akan masuk ke ' + batchName(S.currentBatch) + ' dan bisa diberikan ke reviewer. Kemampuan mengedit setelah itu mengikuti pengaturan admin.',
        detail: (S.formType === 'pg'
          ? 'Kunci jawaban: ' + S.formAnswer
          : 'Jumlah variasi jawaban: ' + ansList.length + (S.formCaseSensitive ? ' (case sensitive)' : ' (tidak case sensitive)')) +
          ' • Estimasi: ' + est + ' detik • Gambar: ' + nImg + '. Pastikan semuanya sudah benar.',
        ok: isEdit ? 'Ya, perbarui' : 'Ya, simpan',
        cancel: 'Periksa lagi',
        onOk: function () { doSave(soal, est); }
      });
    };
  }

  /* ====== ANGGOTA: daftar tim ====== */
  // Label tiap kriteria urut. a = urutan normal, d = setelah dibalik. short = label dropdown.
  var MEM_SORTS = [
    { k: 'nama',   short: 'Nama',   a: 'Nama A–Z',                                   d: 'Nama Z–A' },
    { k: 'status', short: 'Status', a: 'Online dan terakhir aktif paling baru dulu', d: 'Offline paling lama dulu' },
    { k: 'review', short: 'Review', a: 'Yang belum mengerjakan review dulu',         d: 'Yang sudah selesai review dulu' },
    { k: 'soal',   short: 'Soal',   a: 'Yang belum membuat soal dulu',               d: 'Yang paling banyak membuat soal dulu' }
  ];

  function stopMemTimer() { if (S.memTimer) { clearInterval(S.memTimer); S.memTimer = null; } }

  // Sort dikirim ke server sebagai satu kriteria (kunci + arah). Backend tetap
  // menerima array, jadi cukup dibungkus array berisi satu elemen.
  function memPayload() {
    var key = S.memSort[0] || 'nama';
    var p = { sort: [{ key: key, desc: !!S.memDesc[key] }] };
    if (S.memBatch != null) p.batch = S.memBatch;
    return p;
  }

  // action: 'members' | 'members_hide'. silent = refresh otomatis (tanpa layar redup, tanpa render ulang kalau data sama).
  function fetchMembers(action, extra, silent) {
    var req = ++S.memReq;
    if (!silent) { S.memBusy = true; S.memErr = ''; viewMembers(); }
    return api(action, Object.assign(memPayload(), extra || {})).then(function (res) {
      if (req !== S.memReq) return; // ada permintaan yang lebih baru
      S.memBusy = false;
      if (!res.ok && res.code === 'MEMBERS_CLOSED') {
        stopMemTimer(); S.flash = res.error || 'Progres tim sedang ditutup oleh admin.'; loadStatus(); return;
      }
      if (!res.ok) throw new Error(res.error || 'Gagal memuat daftar anggota.');
      var same = silent && S.memData && S.memData.batch === res.batch &&
        JSON.stringify(S.memData.members) === JSON.stringify(res.members);
      S.memData = res; S.memBatch = res.batch;
      if (S.screen === 'members' && !same) viewMembers();
    }).catch(function (e) {
      if (req !== S.memReq) return;
      S.memBusy = false;
      if (isHandled(e) || silent) return;
      S.memErr = e.message === 'Failed to fetch' ? 'Tidak bisa terhubung ke server.' : e.message;
      if (S.screen === 'members') viewMembers();
    });
  }

  function openMembers() {
    S.err = ''; S.memErr = ''; S.memBatch = null; // selalu mulai dari batch aktif
    rememberScreen('members');
    viewLoading('Memuat daftar anggota…');
    var req = ++S.memReq;
    api('members', memPayload()).then(function (res) {
      if (req !== S.memReq) return;
      if (!res.ok) throw new Error(res.error || 'Gagal memuat daftar anggota.');
      S.memData = res; S.memBatch = res.batch;
      S.screen = 'members'; render();
    }).catch(function (e) {
      if (isHandled(e)) return;
      S.flash = e.message; S.screen = 'menu'; loadStatus();
    });
  }

  function memStatusHtml(m) {
    if (m.online) return '<span class="lc-on"><i class="lc-dot on"></i>Online</span>';
    return '<span class="lc-off"><i class="lc-dot"></i>' +
      (m.lastSeenText ? 'Terakhir dilihat ' + esc(m.lastSeenText) : 'Belum pernah aktif') + '</span>';
  }
  function memSoalHtml(m) {
    if (!m.required) return '<span class="lc-mute">—</span>';
    return m.madeOk
      ? '<strong class="lc-yes">✓ Sudah</strong><div class="lc-mute">' + m.made + ' soal</div>'
      : '<strong class="lc-no">✗ Belum</strong>';
  }
  function memReviewHtml(m) {
    if (!m.review) return '<span class="lc-mute">—</span>';
    var r = m.review;
    if (r.state === 'none') return '<strong class="lc-no">0/0</strong><div class="lc-mute">Belum mengambil soal</div>';
    return '<strong class="' + (r.state === 'done' ? 'lc-yes' : '') + '">' + r.done + '/' + r.total + '</strong>' +
      '<div class="lc-mute">' + (r.state === 'done' ? 'Selesai' : 'Belum selesai') + '</div>';
  }

  function viewMembers() {
    if (!S.memData) return openMembers();
    stopMemTimer();
    var ae = document.activeElement, aid = ae && ae.id ? ae.id : ''; // jaga fokus keyboard saat render ulang
    var d = S.memData, sm = d.summary || {}, isAdmin = S.role === 'admin';

    // Batch Trial hanya muncul di daftar jika sedang aktif (server sudah menyaringnya).
    var batchOpts = (d.batches || []).map(function (b) {
      return '<option value="' + b + '"' + (b === d.batch ? ' selected' : '') + '>' + esc(batchName(b)) +
        (b === d.currentBatch ? ' (aktif)' : '') + '</option>';
    }).join('');

    // Sorting: satu dropdown kriteria + satu tombol arah, ringkas untuk layar kecil.
    var sortKey = S.memSort[0] || 'nama';
    var sortSpecNow = MEM_SORTS.find(function (o) { return o.k === sortKey; }) || MEM_SORTS[0];
    var sortDesc = !!S.memDesc[sortKey];
    var sortOptions = MEM_SORTS.map(function (o) {
      return '<option value="' + o.k + '"' + (o.k === sortKey ? ' selected' : '') + '>' + esc(o.short) + '</option>';
    }).join('');
    var sortHtml =
      '<div class="lc-row" style="align-items:flex-end;margin-top:6px">' +
      '<div><label class="lc-label" for="lc-mem-sortkey" style="margin-bottom:6px">Urutkan</label>' +
      '<select class="lc-select" id="lc-mem-sortkey" style="max-width:180px">' + sortOptions + '</select></div>' +
      '<button type="button" class="lc-btn small ghost" id="lc-mem-sortdir" aria-pressed="' + sortDesc + '">⇅ Balik</button>' +
      '</div>' +
      '<p class="lc-mute lc-hintline">' + esc(sortDesc ? sortSpecNow.d : sortSpecNow.a) + '</p>';

    var hideBox = isAdmin
      ? '<label class="lc-toggle" style="margin-top:16px"><input type="checkbox" id="lc-hideme"' + (d.meHidden ? ' checked' : '') + '> ' +
        'Sembunyikan akun admin saya dari daftar anggota</label>' +
        '<p class="lc-mute lc-hintline">Anggota biasa tidak akan melihat akunmu di tabel ini. Sesama admin tetap melihatnya.</p>'
      : '';

    var rows = (d.members || []).map(function (m) {
      return '<tr' + (m.me ? ' class="me"' : '') + '><td>' +
        '<div class="lc-mname"><strong>' + esc(m.nama) + '</strong>' + (m.me ? ' <span class="lc-mute">(kamu)</span>' : '') +
        ' <span class="lc-badge">' + (m.role === 'admin' ? 'Admin' : 'Anggota') + '</span>' +
        (m.hidden ? ' <span class="lc-badge">Disembunyikan dari anggota</span>' : '') + '</div>' +
        '<div class="lc-mstat">' + memStatusHtml(m) + '</div></td>' +
        '<td>' + memSoalHtml(m) + '</td><td>' + memReviewHtml(m) + '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="lc-mute">Belum ada anggota.</td></tr>';

    var topRow =
      '<div class="lc-mem-toprow">' +
      '<div class="lc-mem-batchbox"><label class="lc-label" for="lc-mem-batch">Riwayat batch</label>' +
      '<select class="lc-select" id="lc-mem-batch">' + batchOpts + '</select></div>' +
      '<div class="lc-mem-sortbox">' + sortHtml + '</div>' +
      '</div>';

    app.innerHTML = navBar() +
      '<div class="lc-rule"></div><h2>Progres Tim</h2>' +
      '<p class="lc-mute" style="margin-top:10px">' + sm.online + ' dari ' + sm.total + ' online • ' +
      sm.madeOk + '/' + sm.required + ' sudah membuat soal • ' + sm.reviewDone + '/' + sm.required + ' selesai review (' + esc(batchName(d.batch)) + ')</p>' +
      (d.isCurrent ? '' : '<div class="lc-notice" style="margin-top:12px"><p>Kamu melihat riwayat ' + esc(batchName(d.batch)) +
        '. Status online selalu kondisi saat ini; batch aktif sekarang adalah ' + esc(batchName(d.currentBatch)) + '.</p></div>') +
      '<div class="lc-card" style="margin-top:14px">' + topRow + hideBox + '</div>' +
      '<div class="lc-row"><button class="lc-btn ghost small" id="lc-mem-reload">Muat ulang</button>' +
      '<span class="lc-mute" role="status">' + (S.memBusy ? 'Memperbarui…' : 'Diperbarui otomatis tiap 30 detik.') + '</span></div>' +
      '<div class="lc-tablewrap' + (S.memBusy ? ' lc-mem-dim' : '') + '"><table class="lc-table"><thead><tr>' +
      '<th>Anggota</th><th>Soal (' + esc(batchName(d.batch)) + ')</th><th>Review (' + esc(batchName(d.batch)) + ')</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="lc-row"><button class="lc-btn ghost" id="lc-menu-back">Kembali ke menu</button></div>' +
      (S.memErr ? '<p class="lc-err" role="alert">' + esc(S.memErr) + '</p>' : '');

    bindNav();
    app.querySelector('#lc-mem-batch').onchange = function (e) { S.memBatch = Number(e.target.value); fetchMembers('members'); };
    app.querySelector('#lc-mem-sortkey').onchange = function (e) {
      S.memSort = [e.target.value];
      fetchMembers('members');
    };
    app.querySelector('#lc-mem-sortdir').onclick = function () {
      S.memDesc[sortKey] = !S.memDesc[sortKey];
      fetchMembers('members');
    };
    var hm = app.querySelector('#lc-hideme');
    if (hm) hm.onchange = function () { fetchMembers('members_hide', { hidden: hm.checked }); };
    app.querySelector('#lc-mem-reload').onclick = function () { fetchMembers('members'); };

    // Refresh otomatis supaya status online / progres tetap segar
    S.memTimer = setInterval(function () {
      if (S.screen === 'members' && !S.memBusy) fetchMembers('members', null, true);
    }, 30000);

    if (aid) { var f = app.querySelector('#' + aid); if (f && f.focus) f.focus(); }
  }

  /* ====== FLOW ====== */
  var firstRender = true;
  function render() {
    stopTimer();
    stopFunLoader();
    if (!firstRender) { try { app.scrollIntoView({ block: 'start' }); } catch (e) {} }
    firstRender = false;
    if (S.screen === 'login') return viewLogin();
    if (S.screen === 'menu') return viewMenu();
    if (S.screen === 'ready') return viewReady();
    if (S.screen === 'question') return viewQuestion();
    if (S.screen === 'review') return viewReview();
    if (S.screen === 'adminnext') return viewAdminNext();
    if (S.screen === 'done') return viewDone();
    if (S.screen === 'mine') return viewMine();
    if (S.screen === 'create') return viewCreate();
    if (S.screen === 'adminlist') return viewAdminList();
    if (S.screen === 'settings') return viewSettings();
    if (S.screen === 'audit') return viewAudit();
    if (S.screen === 'members') return viewMembers();
  }

  // Ping langsung saat tab dibuka kembali, supaya status online cepat pulih
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.token && S.screen !== 'login') api('ping').catch(function () {});
  });

  initTheme(); // tema dulu (bawaan terang), baru layar pertama digambar
  if (S.token) { loadProg(); loadStatus(true); } else render();
})();
</script>
</body>
</html>
